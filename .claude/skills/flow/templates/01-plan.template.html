<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="flow-task" content="{task-id}"><title>1 기획 · {task-title}</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/nav.css"></head>
<body>
<!-- flow:nav --><!-- /flow:nav -->
<main class="page">
<h1>1 · 기획</h1>
<p class="meta">상태: 작성 중 · 원본: <a href="{기획서 URL}">{기획서 제목 — 절 번호}</a></p>
<!-- 결론: 3~5문장. 이 작업이 무엇을 만들고 무엇을 만들지 않는지. 다음 단계는 이 블록만 읽는다.
     data-status: done | now | ask | wait. data-summary: 왼쪽 목록에 보일 한 줄 -->
<section class="conclusion" data-status="now" data-summary="{한 줄 요약}"><h2>결론</h2><ul>
<li>{무엇을 만드는지 한 문장}</li>
<li>{범위 밖: 무엇을 하지 않는지}</li>
</ul></section>
<h2>기획서 발췌</h2>
<!-- 이 작업에 해당하는 문장만 그대로 인용한다. 요약하거나 고쳐 쓰지 않는다. -->
<p>"{기획서 문장 그대로}" — {절 번호}</p>
<h2>디자인</h2>
<p>Figma <code>{node id}</code> {화면 이름}. 화면 분석은 2 · 화면 · SOT 맵에 있어요.</p>
</main>
<script src="assets/nav.js"></script><script src="assets/live.js"></script>
</body></html>
